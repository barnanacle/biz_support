name: 크롤링 자동 실행

on:
  # 수동 트리거 (아이폰에서 실행 가능)
  workflow_dispatch:
    inputs:
      pages:
        description: '크롤링 페이지 수 (기본: 10)'
        required: false
        default: '10'

  # 매일 저녁 9시 (KST) = UTC 12:00 자동 실행
  schedule:
    - cron: '0 12 * * *'

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 레포 체크아웃
        uses: actions/checkout@v6

      - name: Python 3.11 설정
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Chrome 설치
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: 'stable'

      - name: ChromeDriver 설치
        uses: nanasess/setup-chromedriver@v2

      - name: Python 패키지 설치
        run: |
          pip install -r requirements.txt

      - name: 크롤러 실행 환경 준비
        run: |
          # unified_crawler.py는 __file__ 기준으로 biz_support_web/ 디렉토리에 data.json을 씀
          # crawler/unified_crawler.py 기준 → crawler/biz_support_web/ 에 쓰게 됨
          mkdir -p crawler/biz_support_web
          # save_to_web_json()이 first_seen 보존을 위해 기존 data.json을 읽으므로 미리 복사.
          # 크롤러가 정상 종료해도 last_updated가 갱신되지 않은 경우는
          # 아래 '결과 확인' 단계에서 잡아낸다.
          cp data.json crawler/biz_support_web/data.json

      - name: 도달성 probe (비차단 관찰용)
        env:
          BIZINFO_RELAY_BASE: ${{ secrets.BIZINFO_RELAY_BASE }}
          BIZINFO_RELAY_KEY: ${{ secrets.BIZINFO_RELAY_KEY }}
        run: |
          # 러너에서의 도달성·차단 여부를 run 로그에 남긴다 (P0/P2 판정 및 장기 모니터링용).
          # 전부 비차단(|| true) — probe 실패가 크롤링을 막지 않는다.
          if [ -n "$BIZINFO_RELAY_BASE" ]; then
            echo "probe relay(excel): $(curl -sS -o /dev/null -w '%{http_code}' -m 20 -H "X-Relay-Key: $BIZINFO_RELAY_KEY" "$BIZINFO_RELAY_BASE/sii/siia/selectSIIA200ExcelDownload.do?rows=15&cpage=1" || echo 'FAIL')" || true
          else
            echo "probe relay(excel): skip (BIZINFO_RELAY_BASE 미설정)"
          fi
          echo "probe sbiz24(api): $(curl -sS -o /dev/null -w '%{http_code}' -m 20 -X POST -H 'Content-Type: application/json' -H 'Origin-Method: GET' --data '{"sortModel":[],"search":{"pbancNm":""},"paging":true,"startRow":0,"endRow":1}' 'https://www.sbiz24.kr/api/combinePbanc/list' || echo 'FAIL')" || true
          echo "probe bizinfo(직접): $(curl -sS -o /dev/null -w '%{http_code}' -m 20 'https://www.bizinfo.go.kr/uss/rss/bizinfoApi.do' || echo 'FAIL')" || true

      - name: 크롤링 실행
        env:
          DISPLAY: ':99'
          BIZINFO_RELAY_BASE: ${{ secrets.BIZINFO_RELAY_BASE }}
          BIZINFO_RELAY_KEY: ${{ secrets.BIZINFO_RELAY_KEY }}
          BIZINFO_API_KEY: ${{ secrets.BIZINFO_API_KEY }}
        run: |
          # Xvfb 가상 디스플레이 (headless Chrome 안정성)
          sudo Xvfb :99 -screen 0 1920x1080x24 &
          sleep 2

          # 크롤러 실행. 스크립트 끝의 git push는 CI 환경에서 실패하지만 그 부분은
          # 크롤러 내부에서 try/except로 처리되어 exit 0 으로 끝난다.
          # ImportError 등으로 즉시 죽는 경우는 전체 워크플로우를 실패시켜야 하므로
          # `|| true` 로 모든 오류를 삼키지 않는다.
          cd crawler
          set -o pipefail
          python -u unified_crawler.py 2>&1 | tee crawl.log
          CRAWLER_EXIT=${PIPESTATUS[0]}
          if [ "$CRAWLER_EXIT" -ne 0 ]; then
            echo "::error::크롤러가 비정상 종료됨 (exit=$CRAWLER_EXIT). 로그 확인 필요."
            exit "$CRAWLER_EXIT"
          fi

      - name: 크롤링 결과 확인 및 반영
        id: check
        run: |
          NEW_PATH="crawler/biz_support_web/data.json"
          if [ ! -f "$NEW_PATH" ]; then
            echo "::error::크롤링 결과 파일 없음: $NEW_PATH"
            exit 1
          fi

          NEW_SIZE=$(stat -c%s "$NEW_PATH" 2>/dev/null || stat -f%z "$NEW_PATH")
          OLD_SIZE=$(stat -c%s "data.json" 2>/dev/null || stat -f%z "data.json" 2>/dev/null || echo "0")

          # last_updated 메타데이터가 이전 본과 동일하면 = 크롤러가 결과를 못 썼다는 뜻.
          # (예: ImportError로 즉시 죽은 경우, 사전 복사한 prev 파일이 그대로 남는다.)
          OLD_LAST_UPDATED=$(python3 -c "import json; print(json.load(open('data.json','r',encoding='utf-8')).get('last_updated','') or '')")
          NEW_LAST_UPDATED=$(python3 -c "import json; print(json.load(open('$NEW_PATH','r',encoding='utf-8')).get('last_updated','') or '')")

          echo "기존 data.json:    ${OLD_SIZE} bytes / last_updated='${OLD_LAST_UPDATED}'"
          echo "새로운 data.json:  ${NEW_SIZE} bytes / last_updated='${NEW_LAST_UPDATED}'"

          if [ "$NEW_SIZE" -le 1000 ]; then
            echo "::error::크롤링 결과가 너무 작음 (${NEW_SIZE} bytes). 기존 데이터 유지."
            echo "updated=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          if [ -z "$NEW_LAST_UPDATED" ] || [ "$NEW_LAST_UPDATED" = "$OLD_LAST_UPDATED" ]; then
            echo "::error::last_updated 메타데이터가 갱신되지 않음. 크롤러가 결과를 쓰지 못한 것으로 판단."
            echo "updated=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          # 항목 수가 이전 대비 30% 이상 줄어들면 사이트 다수가 일시적으로 크롤링 실패한
          # 것으로 보고 거부 — 기존 데이터 유지. (정상 변동은 ±10% 수준.)
          OLD_COUNT=$(python3 -c "import json; print(len(json.load(open('data.json','r',encoding='utf-8')).get('data',[])))")
          NEW_COUNT=$(python3 -c "import json; print(len(json.load(open('$NEW_PATH','r',encoding='utf-8')).get('data',[])))")
          echo "항목 수: ${OLD_COUNT} → ${NEW_COUNT}"
          if [ "$OLD_COUNT" -gt 100 ]; then
            MIN_COUNT=$((OLD_COUNT * 70 / 100))
            if [ "$NEW_COUNT" -lt "$MIN_COUNT" ]; then
              echo "::error::항목 수 급감(${OLD_COUNT} → ${NEW_COUNT}, 최소 ${MIN_COUNT} 필요). 다수 사이트 일시적 실패로 판단, 기존 데이터 유지."
              echo "updated=false" >> "$GITHUB_OUTPUT"
              exit 1
            fi
          fi

          cp "$NEW_PATH" data.json
          echo "updated=true" >> "$GITHUB_OUTPUT"
          echo "✅ data.json 업데이트 완료 (${NEW_SIZE} bytes, last_updated=${NEW_LAST_UPDATED})"

      - name: 변경사항 커밋 및 푸시
        if: steps.check.outputs.updated == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data.json

          # 변경사항이 있을 때만 커밋
          if git diff --cached --quiet; then
            echo "변경사항 없음. 커밋 생략."
          else
            TIMESTAMP=$(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M:%S')
            git commit -m "auto: 크롤링 데이터 업데이트 (${TIMESTAMP})"
            git push
            echo "✅ 배포 완료! Cloudflare Pages 자동 빌드 시작됨."
          fi
